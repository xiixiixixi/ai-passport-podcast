name: Public product checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify the public file list and private-material boundary
        run: python3 scripts/check-public-commit.py --all
      - name: Install host audio dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-venv
      - name: Install locked Python dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r server/requirements.txt -r scripts/flash-requirements.txt
      - name: Backend tests
        working-directory: server
        run: ../.ci-venv/bin/python -m unittest discover -s tests -v
      - name: Installer and protected-upgrade tests
        run: .ci-venv/bin/python -m unittest discover -s tests -v
      - name: Firmware repository and host tests
        working-directory: firmware
        run: ./tools/validate.sh --static
  web:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Real page-program behavior at simulated browser boundaries
        run: node server/tests/test_player_web.cjs
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile and verify public firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: cd firmware && ./tools/validate.sh --firmware
      - name: Retain checked merged image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-firmware-${{ github.run_id }}
          path: firmware/build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7
